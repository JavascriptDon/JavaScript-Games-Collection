<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./favicon.ico" rel="icon" type="image/x-icon">
  <title>Whack a Mole</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #222;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .game-container {
      background: #333;
      padding: 20px 24px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 420px;
      max-width: 90vw;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .stats {
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
      padding: 2px;
    }

    .stats span {
      font-weight: 600;
      color: #ffd54f;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
      font-size: 0.9rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: #4caf50;
      color: #fff;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #43a047;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    select {
      background: #444;
      color: #f5f5f5;
      border-radius: 999px;
      border: 1px solid #555;
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .hole {
      position: relative;
      width: 100%;
      padding-bottom: 100%; /* square */
      background: radial-gradient(circle at 30% 30%, #555, #222);
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.7);
      transition: transform 0.1s ease;
    }

    .hole:active {
      transform: scale(0.97);
    }

    .mole {
      position: absolute;
      left: 50%;
      bottom: -60%;
      transform: translateX(-50%);
      width: 70%;
      height: 70%;
      background: #8d6e63;
      border-radius: 50% 50% 40% 40%;
      box-shadow: 0 -4px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      transition: bottom 0.15s ease-out;
      pointer-events: none;
    }

    .mole.up {
      bottom: 5%;
      pointer-events: auto;
    }

    .message {
      margin-top: 14px;
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.2em;
      color: #b0bec5;
    }

    .message strong {
      color: #ffca28;
    }

   /* Mole pop animation */
    .mole.up {
      animation: pop 0.25s ease-out;
    }

    @keyframes pop {
      0% { transform: translateX(-50%) scale(0.7); }
      100% { transform: translateX(-50%) scale(1); }
    }

    /* Hit animation */
    .mole.hit {
      animation: hit 0.25s ease-out forwards;
    }

    @keyframes hit {
      0% { transform: translateX(-50%) scale(1); opacity: 1; }
      100% { transform: translateX(-50%) scale(0.4); opacity: 0; }
    }

    /* Miss shake */
    .hole.miss {
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }

  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">Whack a Mole</div>
      <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">30</span>s</div>
        <div>High Score: <span id="highScore">0</span></div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <div>
        Difficulty:
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>

    <div class="grid" id="grid">
      <!-- 9 holes -->
      <div class="hole" data-index="0"><div class="mole">🐹</div></div>
      <div class="hole" data-index="1"><div class="mole">🐹</div></div>
      <div class="hole" data-index="2"><div class="mole">🐹</div></div>
      <div class="hole" data-index="3"><div class="mole">🐹</div></div>
      <div class="hole" data-index="4"><div class="mole">🐹</div></div>
      <div class="hole" data-index="5"><div class="mole">🐹</div></div>
      <div class="hole" data-index="6"><div class="mole">🐹</div></div>
      <div class="hole" data-index="7"><div class="mole">🐹</div></div>
      <div class="hole" data-index="8"><div class="mole">🐹</div></div>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>

    // Sounds
    const sndPop = new Audio("./hit-jump.wav");
    const sndHit = new Audio("./hit-jump.wav");
    const sndMiss = new Audio("./game-notification.wav");
    const sndEnd = new Audio("./game-notification.wav");

    const startBtn = document.getElementById("startBtn");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");
    const difficultySelect = document.getElementById("difficulty");
    const holes = Array.from(document.querySelectorAll(".hole"));
    const moles = Array.from(document.querySelectorAll(".mole"));
    const highScoreEl = document.getElementById("highScore");
    let highScore = Number(localStorage.getItem("whackHighScore")) || 0;
    highScoreEl.textContent = highScore;

    let score = 0;
    let timeLeft = 30;
    let gameTimer = null;
    let moleTimer = null;
    let currentIndex = null;
    let gameActive = false;

    function getMoleInterval() {
      const difficulty = difficultySelect.value;
      if (difficulty === "easy") return 900;
      if (difficulty === "hard") return 450;
      return 650; // normal
    }

    function getGameDuration() {
      const difficulty = difficultySelect.value;
      if (difficulty === "easy") return 35;
      if (difficulty === "hard") return 25;
      return 30;
    }

    function randomHoleIndex() {
      let idx;
      do {
        idx = Math.floor(Math.random() * holes.length);
      } while (idx === currentIndex);
      return idx;
    }

    function showMole() {
      // hide previous
      if (currentIndex !== null) {
        moles[currentIndex].classList.remove("up");
      }

      if (!gameActive) return;

      const idx = randomHoleIndex();
      currentIndex = idx;
      moles[idx].classList.add("up");

      sndPop.currentTime = 0;
      sndPop.play
      // schedule next mole
      const interval = getMoleInterval();
      moleTimer = setTimeout(showMole, interval);
    }

    function startGame() {
      if (gameActive) return;

      gameActive = true;
      score = 0;
      timeLeft = getGameDuration();
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      messageEl.textContent = "";
      startBtn.disabled = true;
      difficultySelect.disabled = true;

      // start timers
      showMole();
      gameTimer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(gameTimer);
      clearTimeout(moleTimer);
      gameTimer = null;
      moleTimer = null;

      // hide any mole
      if (currentIndex !== null) {
        moles[currentIndex].classList.remove("up");
        currentIndex = null;
      }

      startBtn.disabled = false;
      difficultySelect.disabled = false;
      sndEnd.play();

      // update high score
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("whackHighScore", highScore);
        highScoreEl.textContent = highScore;
      }

      let comment = "Nice try!";
      if (score >= 25) comment = "Legendary reflexes!";
      else if (score >= 18) comment = "Great job!";
      else if (score >= 10) comment = "Not bad at all!";

      messageEl.innerHTML = `Time's up! Final score: <strong>${score}</strong>. ${comment}`;
    }

    function whack(event) {
    if (!gameActive) return;

    const hole = event.currentTarget;
    const idx = Number(hole.dataset.index);

    // HIT
    if (idx === currentIndex && moles[idx].classList.contains("up")) {
      score++;
      scoreEl.textContent = score;

      const mole = moles[idx];
      mole.classList.add("hit");

      sndHit.currentTime = 0;
      sndHit.play();

      setTimeout(() => mole.classList.remove("hit"), 250);

      mole.classList.remove("up");
      currentIndex = null;
    }

    // MISS
    else {
      hole.classList.add("miss");
      sndMiss.currentTime = 0;
      sndMiss.play();
      setTimeout(() => hole.classList.remove("miss"), 300);
    }
  }


    // event listeners
    startBtn.addEventListener("click", startGame);
    holes.forEach(hole => hole.addEventListener("click", whack));
  </script>
</body>
</html>
